version: "3.9"

# LEGACY PROTOTYPE ONLY — not Wathefni HR / dashboard AI Recruiter.
# Bound to localhost. /internal/* is disabled unless LEGACY_AI_RECRUITER_INTERNAL_ENABLED=1
# and LEGACY_AI_RECRUITER_INTERNAL_TOKEN is set.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruiter
      POSTGRES_PASSWORD: recruiter
      POSTGRES_DB: ai_recruiter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      LEGACY_AI_RECRUITER_INTERNAL_ENABLED: "0"
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads

volumes:
  pgdata:
