[Service]
# Production drop-in template. This file is intentionally not installed by the
# HR-2 staging closure; production provisioning/deployment requires separate approval.
Environment=WATHEFNI_ENV=production
Environment=WATHEFNI_PUBLIC_BASE_URL=https://api.octo-hr.com
Environment=PUBLIC_CANDIDATE_BASE_URL=https://api.octo-hr.com
Environment=WATHEFNI_EXPECTED_DATABASE_HOST=127.0.0.1
Environment=WATHEFNI_EXPECTED_DATABASE_PORT=5432
Environment=WATHEFNI_EXPECTED_DATABASE_NAME=wathefni
Environment=WATHEFNI_DATABASE_ENVIRONMENT_MARKER=wathefni-production-isolation-v1
Environment=WATHEFNI_ASSESSMENT_AUTHORING=false
Environment=WATHEFNI_CANONICAL_LIFECYCLE=true
Environment=WATHEFNI_STAGE_B_ENABLED=1
Environment=WATHEFNI_STAGE_B_CANARY_ONLY=0
Environment=WATHEFNI_STAGE_B_PUBLIC_POSITIONS=J2P2_PROD_TEST
Environment=WATHEFNI_STAGE_B_PUBLIC_APPLY_CODES=APPLY-WATHEFNI-J2P2_PROD_TEST
Environment=WATHEFNI_STAGE_B_LIVE_WHATSAPP=1
Environment=WATHEFNI_STAGE_B_STAMP_DRY_RUN=0
Environment=WATHEFNI_STAGE_B_RATE_LIMIT_PER_HOUR=8
