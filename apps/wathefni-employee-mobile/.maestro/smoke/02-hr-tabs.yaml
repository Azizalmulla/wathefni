# Smoke: walk HR bottom tabs that are visible for the signed-in operator.
# Optional tabs (people/inbox/hiring) are tapped only when present — module-off safe.
# Prerequisite: flow 01-hr-login (or an already signed-in HR session).
appId: ai.wathefni.employee
tags:
  - smoke
  - hr
  - tabs
  - requires_session
---
- extendedWaitUntil:
    visible:
      id: "e2e.tab.hr.home"
    timeout: 30000
- tapOn:
    id: "e2e.tab.hr.home"
- takeScreenshot: hr-tab-home
- runFlow:
    when:
      visible:
        id: "e2e.tab.hr.people"
    commands:
      - tapOn:
          id: "e2e.tab.hr.people"
      - takeScreenshot: hr-tab-people
- runFlow:
    when:
      visible:
        id: "e2e.tab.hr.inbox"
    commands:
      - tapOn:
          id: "e2e.tab.hr.inbox"
      - takeScreenshot: hr-tab-inbox
- runFlow:
    when:
      visible:
        id: "e2e.tab.hr.hiring"
    commands:
      - tapOn:
          id: "e2e.tab.hr.hiring"
      - takeScreenshot: hr-tab-hiring
- tapOn:
    id: "e2e.tab.hr.more"
- takeScreenshot: hr-tab-more
- tapOn:
    id: "e2e.tab.hr.home"
