# BrowserStack: Leave Reject → reason → Confirm on real device.
# Requires MAESTRO_LEAVE_REJECT_ID (separate disposable requested leave) + HR credentials.
# Do not reuse the approve fixture.
appId: ai.wathefni.employee
tags:
  - smoke
  - browserstack
  - hr
  - leave
  - mutation
  - reject
  - requires_credentials
  - needs_fixtures
---
- runFlow:
    when:
      notVisible:
        id: "e2e.tab.hr.home"
    file: 01-hr-login.yaml
- openLink: wathefni://hr/leave/${MAESTRO_LEAVE_REJECT_ID}
- extendedWaitUntil:
    visible:
      id: "e2e.hr.leave.rejectReason"
    timeout: 90000
- tapOn:
    id: "e2e.hr.leave.rejectReason"
- inputText: "E2E BrowserStack reject reason — disposable"
- tapOn:
    id: "e2e.hr.leave.reject"
- extendedWaitUntil:
    visible:
      id: "e2e.confirm.sheet"
    timeout: 30000
- takeScreenshot: bs-leave-reject-confirm-sheet
- tapOn:
    id: "e2e.confirm.submit"
- extendedWaitUntil:
    notVisible:
      id: "e2e.confirm.sheet"
    timeout: 90000
- takeScreenshot: bs-leave-reject-after-confirm
