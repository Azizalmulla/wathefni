<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f3ebe0;font-family:"IBM Plex Sans","Segoe UI",sans-serif;padding:24px;color:#23211d}
.shell{max-width:920px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:16px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer}
.btn-primary{background:#23211d;color:#fff}
.btn-ghost{background:transparent;color:#716a5e}
.btn-sec{background:#f8f3e9;color:#23211d;border:1px solid #e8dfd0}
.panel{background:#fffaf0;border-radius:1.55rem;padding:20px}
.h2{font-size:15px;font-weight:600;margin:0}
.hint{font-size:12px;color:#716a5e;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;background:#f8f3e9;color:#716a5e}
.chip.on{background:#23211d;color:#fff}
.list{border:1px solid #e8dfd0;border-radius:1.1rem;background:#f8f3e9cc;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #ddd3c1b3;min-height:44px}
.row:last-child{border-bottom:0}
.title{font-size:14px;font-weight:600}
.meta{font-size:12px;color:#716a5e;margin-top:2px}
.signals{font-size:12px;color:#716a5e;margin-top:4px;display:flex;flex-wrap:wrap;gap:12px}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;background:#dcfce7;color:#166534;margin-inline-start:8px}
.badge.draft{background:#fef3c7;color:#92400e}
.link{font-weight:600;color:#23211d;text-decoration:underline;text-underline-offset:3px}
.empty{border:1px dashed #d6cbb8;border-radius:1.5rem;padding:20px;margin:16px;color:#716a5e;font-size:14px}
.skel{padding:12px 16px;border-bottom:1px solid #eee5d4}
.bar{height:14px;border-radius:6px;background:#eee5d4;margin:6px 0}
.bar.s{width:40%}.bar.m{width:30%}.bar.t{width:25%}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.metric{background:#fffaf0;border:1px solid #e8dfd0;border-radius:1.2rem;padding:12px}
.metric .l{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8a8274}
.metric .v{font-size:22px;font-weight:600;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8a8274;padding:10px;background:#f7f1e7}
td{padding:10px;border-top:1px solid #e8dfd0;background:#fffaf0}
.caption{margin-top:12px;font-size:12px;color:#716a5e}
.scroll{overflow:auto;border:1px solid #e8dfd0;border-radius:1rem}
</style></head><body><div class="shell">
<div class="toolbar"><button class="btn btn-primary">+ Create job</button></div>
<div class="panel">
  <div class="h2">Job openings</div>
  <div class="chips">
    <button class="chip">All</button><button class="chip on">Open</button>
    <button class="chip" style="background:transparent;text-decoration:underline">Clear filters</button>
  </div>
  <div class="list">
    <div class="empty">No openings match these filters.</div>
    <div style="padding:0 16px 16px"><button class="btn btn-sec">Clear filters</button></div>
  </div>
</div>
<p class="caption">Filtered empty + Clear filters</p>
</div></body></html>
