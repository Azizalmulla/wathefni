<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;background:#f3ebe0;font-family:"IBM Plex Sans","Segoe UI",sans-serif;padding:24px;color:#23211d}
.shell{max-width:960px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:13px}
.btn-primary{background:#23211d;color:#fff}
.btn-ghost{background:transparent;color:#716a5e}
.btn-sec{background:#f8f3e9;border:1px solid #e8dfd0}
.panel{background:#fffaf0;border-radius:1.55rem;padding:20px}
.h2{font-size:15px;font-weight:600;margin:0}
.hint{font-size:12px;color:#716a5e;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;background:#f8f3e9;color:#716a5e}
.chip.on{background:#23211d;color:#fff}
.box{border:1px solid #e8dfd0;border-radius:1.1rem;background:#f8f3e9cc;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8a8274;padding:12px 14px;border-bottom:1px solid #ddd3c1}
td{padding:12px 14px;border-bottom:1px solid #ddd3c1b3;vertical-align:middle}
tr:last-child td{border-bottom:0}
.title{font-weight:600}
.meta{font-size:12px;color:#716a5e;margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;background:#dcfce7;color:#166534}
.badge.draft{background:#fef3c7;color:#92400e}
.link{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.muted{color:#716a5e}
.cap{margin-top:12px;font-size:12px;color:#716a5e}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #ddd3c1b3}
.row:last-child{border-bottom:0}
.shell{max-width:360px}</style></head><body><div class=shell>
<div class="toolbar" style="flex-direction:column"><button class="btn btn-primary">+ Create job</button></div>
<div class="panel"><div class="h2">Job openings</div>
<div class="chips"><span class="chip on">All</span><span class="chip">Open</span><span class="chip">Draft</span></div>
<div class="box">
<div class="row"><div style="flex:1"><div class="title">Accounting Excel <span class="badge">Open</span></div><div class="meta">Finance · Kuwait</div><div class="meta"><span class="link">3 applications</span> · 1 remaining of 2</div></div><div>›</div></div>
<div class="row"><div style="flex:1"><div class="title">Sales Lead <span class="badge draft">Draft</span></div><div class="meta">No applications yet</div></div><div>›</div></div>
</div></div>
<p class="cap">Mobile — stacked cards</p>
</div></body></html>
