# Non-secret, tenant-scoped production parity gates.
# Install as a late wathefni-orchestrator.service drop-in so these exact values
# preserve the accepted WATHEFNI synthetic canary while admitting only the
# synthetic OCTOHR-STORE-REVIEW tenant for the newly exposed frozen surfaces.
[Service]
Environment=WATHEFNI_PERFORMANCE_GOALS_C1=on
Environment=WATHEFNI_PERFORMANCE_GOALS_COMPANIES=OCTOHR-STORE-REVIEW
Environment=WATHEFNI_TALENT_PROFILE_C5=on
Environment=WATHEFNI_TALENT_PROFILE_COMPANIES=OCTOHR-STORE-REVIEW
Environment=WATHEFNI_LEARNING_C2=on
Environment=WATHEFNI_LEARNING_COMPANIES=OCTOHR-STORE-REVIEW
Environment=WATHEFNI_BENEFITS_C3=on
Environment=WATHEFNI_BENEFITS_COMPANIES=OCTOHR-STORE-REVIEW
Environment=WATHEFNI_ENGAGEMENT_C5=on
Environment=WATHEFNI_ENGAGEMENT_COMPANIES=OCTOHR-STORE-REVIEW

# Canonical Payroll / Payslip authorities. These values append the review
# tenant and review phone/key markers to the already-qualified production
# synthetic canary instead of replacing it.
Environment=WATHEFNI_PAYROLL_WAVE1=1
Environment=WATHEFNI_PAYROLL_WAVE1_COMPANIES=WATHEFNI,OCTOHR-STORE-REVIEW
Environment=WATHEFNI_PAYROLL_WAVE1_SYNTHETIC_ONLY=1
Environment=WATHEFNI_PAYROLL_WAVE1_SYNTHETIC_KEY_MARKERS=PYW1,PYW1-SYNTH|,OCTOHR-STORE-REVIEW
Environment=WATHEFNI_PAYROLL_WAVE1_SYNTHETIC_PHONE_PREFIXES=965539,965000

Environment=WATHEFNI_PAYROLL_WAVE2A=1
Environment=WATHEFNI_PAYROLL_WAVE2A_COMPANIES=WATHEFNI,OCTOHR-STORE-REVIEW
Environment=WATHEFNI_PAYROLL_WAVE2A_SYNTHETIC_ONLY=1
Environment=WATHEFNI_PAYROLL_WAVE2A_SYNTHETIC_KEY_MARKERS=PYW2ADB,PYW2ADB-SYNTH|,PYW2ACB,PYW2ACB-SYNTH|,PYW2AB,PYW2AB-SYNTH|,PYW2A,PYW2A-SYNTH|,PYW1,PYW1-SYNTH|,OCTOHR-STORE-REVIEW
Environment=WATHEFNI_PAYROLL_WAVE2A_SYNTHETIC_PHONE_PREFIXES=965540,965539,965000

Environment=WATHEFNI_PAYROLL_WAVE3=1
Environment=WATHEFNI_PAYROLL_WAVE3_COMPANIES=WATHEFNI,OCTOHR-STORE-REVIEW
Environment=WATHEFNI_PAYROLL_WAVE3_SYNTHETIC_ONLY=1
Environment=WATHEFNI_PAYROLL_WAVE3_SYNTHETIC_KEY_MARKERS=PYW3,PYW3-SYNTH|,PYW2B,PYW2B-SYNTH|,PYW2A,PYW2ACB,PYW1,PYW1-SYNTH|,W2BB,W3B,OCTOHR-STORE-REVIEW
Environment=WATHEFNI_PAYROLL_WAVE3_SYNTHETIC_PHONE_PREFIXES=965541,965540,965539,965000
