# Non-secret, tenant-scoped production parity gates.
#
# The base unit already loads production EnvironmentFile entries. systemd
# applies those file values after direct Environment= assignments, so a direct
# assignment in this late drop-in can still be replaced by the legacy files.
# Load this dedicated file last instead; it preserves the accepted WATHEFNI
# synthetic canary while admitting only OCTOHR-STORE-REVIEW.
[Service]
EnvironmentFile=/opt/wathefni/var/octohr-production-parity.env
EnvironmentFile=/root/.openclaw/secrets/wathefni-postmark.production.env
