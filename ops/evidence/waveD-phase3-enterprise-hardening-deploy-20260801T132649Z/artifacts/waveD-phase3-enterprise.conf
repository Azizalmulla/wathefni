# Wave D Phase 3 — enterprise hardening pins (safe defaults)
# External tenants remain allowlist-gated. Mailbox sync stays off.
# Postmark env: expected=production; PIN allows current webhooks without
# custom header while staging markers still fail closed.
[Service]
Environment=WATHEFNI_INBOUND_ALLOWED_COMPANIES=WATHEFNI
Environment=WATHEFNI_MAILBOX_SYNC=off
Environment=WATHEFNI_INBOUND_DEFAULT_PLAN=enterprise
Environment=WATHEFNI_POSTMARK_INBOUND_ENV=production
Environment=WATHEFNI_POSTMARK_INBOUND_ENV_PIN=production
Environment=WATHEFNI_INTAKE_RETENTION_EXECUTE=off
Environment=WATHEFNI_INTAKE_TENANT_CONCURRENCY=8
