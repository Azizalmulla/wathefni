# Exact allowlist change (NOT APPLIED)

**Status:** Draft only. Do **not** apply until GO + named company approved.

## Current (live)

File: `/etc/systemd/system/wathefni-orchestrator.service.d/waveD-phase2-inbound-allowlist.conf`

```ini
[Service]
Environment=WATHEFNI_INBOUND_ALLOWED_COMPANIES=WATHEFNI
Environment=WATHEFNI_MAILBOX_SYNC=off
```

Also reinforced in `waveD-phase3-enterprise.conf` and `waveD-phase5-mailbox-connectors.conf` (`MAILBOX_SYNC=off`, retention execute off).

## Proposed (single external canary)

Replace **only** the allowlist line in `waveD-phase2-inbound-allowlist.conf` (keep mailbox sync off):

```ini
[Service]
Environment=WATHEFNI_INBOUND_ALLOWED_COMPANIES=WATHEFNI,<COMPANY_CODE>
# Mailbox sync must remain off for forwarding-only external canary
Environment=WATHEFNI_MAILBOX_SYNC=off
```

If `waveD-phase3-enterprise.conf` also sets `WATHEFNI_INBOUND_ALLOWED_COMPANIES`, update it to the **same** comma-separated value so drop-in order cannot silently override.

## Apply sequence (when authorized — not now)

```bash
# 1. Edit BOTH drop-ins that set INBOUND_ALLOWED to identical values
# 2. daemon-reload + restart orchestrator
systemctl daemon-reload
systemctl restart wathefni-orchestrator.service
# 3. Verify
systemctl show wathefni-orchestrator -p Environment | tr ' ' '\n' | grep INBOUND_ALLOWED
curl -sS -o /dev/null -w 'orch=%{http_code}\n' http://127.0.0.1:8010/health
# Expect: WATHEFNI,<COMPANY_CODE> and orch=200
# Confirm MAILBOX_SYNC still off
systemctl show wathefni-orchestrator -p Environment | tr ' ' '\n' | grep MAILBOX_SYNC
```

## Instant revoke (emergency)

```ini
Environment=WATHEFNI_INBOUND_ALLOWED_COMPANIES=WATHEFNI
```

Then `daemon-reload` + restart orchestrator. Optionally also set tenant `inbound_forwarding_enabled=false` and/or `inbound_enterprise.kill_switch=true` before removing from allowlist.
