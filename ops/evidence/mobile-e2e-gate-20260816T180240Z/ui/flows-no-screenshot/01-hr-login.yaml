# Smoke: HR work-email sign-in → local PIN setup → HR home tab.
# Requires env: MAESTRO_HR_COMPANY, MAESTRO_HR_EMAIL, MAESTRO_HR_PASSWORD, MAESTRO_PIN
appId: ai.wathefni.employee
tags:
  - smoke
  - hr
  - auth
  - requires_credentials
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "e2e.auth.methodSwitch"
    timeout: 45000
- tapOn:
    id: "e2e.auth.method.workEmail"
- assertVisible:
    id: "e2e.auth.hr.company"
- tapOn:
    id: "e2e.auth.hr.company"
- eraseText
- inputText: ${MAESTRO_HR_COMPANY}
- scrollUntilVisible:
    element:
      id: "e2e.auth.hr.email"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "e2e.auth.hr.email"
- eraseText
# iOS can corrupt an email entered as one Maestro inputText command. The
# BrowserStack release flow uses the same deterministic three-part entry.
- inputText: ${MAESTRO_HR_EMAIL_LOCAL}
- inputText: "@"
- inputText: ${MAESTRO_HR_EMAIL_DOMAIN}
- scrollUntilVisible:
    element:
      id: "e2e.auth.hr.password"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "e2e.auth.hr.password"
- eraseText
- inputText: ${MAESTRO_HR_PASSWORD}
- tapOn:
    point: "50%,28%"
- tapOn:
    id: "e2e.auth.hr.signIn"
- extendedWaitUntil:
    visible:
      id: "e2e.pin.root"
    timeout: 60000
- inputText: ${MAESTRO_PIN}
- tapOn:
    id: "e2e.pin.continue"
- waitForAnimationToEnd
- inputText: ${MAESTRO_PIN}
- tapOn:
    id: "e2e.pin.continue"
- runFlow:
    when:
      visible:
        id: "e2e.biometric.notNow"
    commands:
      - tapOn:
          id: "e2e.biometric.notNow"
- extendedWaitUntil:
    visible:
      id: "e2e.tab.hr.home"
    timeout: 60000
- assertVisible:
    id: "e2e.tab.hr.home"
