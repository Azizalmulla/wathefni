<!doctype html><html><head><meta charset=utf-8><style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
:root{--cream:#f4eee3;--ink:#23211d;--muted:#5c554a;--line:#e8dfd0;--panel:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f1e6,#efe6d6);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif}
.shell{max-width:980px;margin:0 auto;padding:24px}.board{background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:18px;padding:16px}
.h{font-size:18px;font-weight:700;margin:0 0 4px}.sub{font-size:12.5px;color:rgba(92,85,74,.85);margin:0 0 12px}
.row{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-size:14px;font-weight:700;margin:6px 0 2px}.meta{font-size:12px;color:rgba(92,85,74,.75)}.next{font-weight:600;color:var(--ink)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:#f6ebcf;color:#b07a1a}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;background:var(--ink);color:#fff}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.menu{border:0;background:transparent;font-size:18px}
.actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
</style></head><body><div class=shell><div class=board><p class=h>Onboarding queue</p><p class=sub>Primary action derived from ownership / status (not hard-coded Remind)</p><div class=row data-primary-action=remind><div><span class=badge>remind</span><div class=name>Sara Al-Mutairi</div><div class=meta><span class=next>Next: Employee · Civil ID</span></div></div><div class=actions><button class='btn'>Remind</button><button class=menu>⋯</button></div></div><div class=row data-primary-action=open_checklist><div><span class=badge>open_checklist</span><div class=name>Omar Hassan</div><div class=meta><span class=next>Next: HR · Contract countersign</span></div></div><div class=actions><button class='btn'>Open checklist</button><button class=menu>⋯</button></div></div><div class=row data-primary-action=review><div><span class=badge>review</span><div class=name>Noura Saeed</div><div class=meta><span class=next>Next: Employee · Passport (uploaded)</span></div></div><div class=actions><button class='btn'>Review</button><button class=menu>⋯</button></div></div><div class=row data-primary-action=view_details><div><span class=badge>view_details</span><div class=name>Completed hire</div><div class=meta><span class=next>Next: —</span></div></div><div class=actions><button class='btn sec'>View details</button><button class=menu>⋯</button></div></div></div></div></body></html>
